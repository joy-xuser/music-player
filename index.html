t:50%;bottom:3%;transform:translate(-50%,10px);padding:10px 18px;border:1px solid #ffbd4c66;border-radius:99px;background:#1b0c06eF;color:#ffe1a5;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.app.dim .sky{filter:brightness(.7) saturate(.8)}.app.dim .goddess{filter:brightness(.8) drop-shadow(12px 20px 28px #1c0b04)}.app.list-hidden .playlist{opacity:0;pointer-events:none;transform:translateX(25px)}.show-list{display:none;position:absolute;top:16%;right:4%;z-index:3;border:1px solid #ffbd4b70;border-radius:24px;background:#241207;color:#ffe2a8;padding:12px 18px;cursor:pointer}.app.list-hidden .show-list{display:block}

<body><main class="app" id="app"><div class="sky"></div><div class="trees"></div><div class="temple"></div><div class="river"></div><div class="waterglow"></div><img class="goddess" src="assets/durga-portrait.png" alt="সোনালি আলোয় দুর্গা প্রতিমা ও ত্রিশূল">
<header><span class="trident" aria-hidden="true"><svg viewBox="0 0 40 58"><path d="M20 56V27M20 27C9 19 8 10 8 4c7 4 11 9 12 17C21 12 26 6 33 3c0 10-3 18-13 24M8 11c-6 8-4 16 2 20M32 10c6 8 4 16-2 21" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="brand">আগমনী সুর</div><div class="brand-sub">দেবীর আগমন</div><div class="head-actions"><span class="live"><i></i>LIVE</span><button class="round theme" aria-label="আলো বদলান" title="আলো বদলান">☼</button><button class="round fullscreen" aria-label="পূর্ণ পর্দা" title="পূর্ণ পর্দা">⛶</button></div></header>
<section class="hero-title" aria-label="আগমনী সুর"><h1>আগমনী সুর</h1><h2>দেবীর আগমন</h2><p>শিউলি-ভেজা ভোর · ঢাকের তালে · আগমনের আবেশ</p></section>
<aside class="playlist" aria-label="গানের তালিকা"><div class="playlist-head"><strong id="playlist-title">♫ &nbsp; Loading playlist…</strong><button class="hide-list">⌃ &nbsp; Hide List</button></div><div class="tracks" id="tracks"></div><div class="playlist-state" id="playlist-state" role="status">Connecting to Invidious…</div></aside><button class="show-list">♫ &nbsp; Show playlist</button>
<section class="player" aria-label="মিউজিক প্লেয়ার"><img class="cover" src="assets/durga-portrait.png" alt="দুর্গা প্রতিমার অ্যালবাম কভার"><div class="song-info"><span class="song-live">● LIVE</span><h3 class="song-title">Chandipath (Recitation)</h3><div class="song-artist">Birendra Krishna Bhadra</div></div><div class="controls"><button class="control prev" aria-label="আগের গান">|◀</button><button class="control main toggle" aria-label="বিরতি দিন">Ⅱ</button><button class="control next" aria-label="পরের গান">▶|</button></div><div class="side-controls"><span class="volume-icon">◖))</span><input class="volume" aria-label="ভলিউম" type="range" min="0" max="100" value="68"><button class="round fullscreen" aria-label="পূর্ণ পর্দা" title="পূর্ণ পর্দা">⛶</button></div><div class="timeline"><input class="seek" type="range" min="0" max="405" value="138" aria-label="গানের অবস্থান"><div class="times"><span class="elapsed">02:18</span><span>06:45</span></div></div></section>
<div class="quote">আগমনের আবেশে<br>জেগে উঠুক শরতের ভোর</div><div class="toast" role="status" aria-live="polite"></div><audio id="audio" preload="none"></audio></main>
<script>
const DEFAULT_PLAYLIST='PLTSRCGR4a75c';
const app=document.querySelector('#app'),list=document.querySelector('#tracks'),toast=document.querySelector('.toast'),audio=document.querySelector('#audio'),state=document.querySelector('#playlist-state'),titleEl=document.querySelector('#playlist-title');
let songs=[],current=-1,currentFormat=null,currentInstance='',proxyFallbackUsed=false,audioFormatFallbackAttempted=false,playlistTitle='Playlist',seek=document.querySelector('.seek'),volume=document.querySelector('.volume');
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function fmt(n){if(!Number.isFinite(n))return '00:00';return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`}
function duration(s){return Number.isFinite(+s)&&+s>0?+s:0}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){titleEl.textContent=`♫  ${playlistTitle} (${songs.length})`;list.innerHTML=songs.map((s,i)=>`<button class="track ${i===current?'active':''}" data-index="${i}" title="${escapeHtml(s.title)}"><span class="number">${i===current?'▥':i+1}</span><span class="name">${escapeHtml(s.title)}</span><span class="artist">${escapeHtml(s.author||'YouTube')}</span><span class="playmark">▶</span></button>`).join('');list.querySelectorAll('.track').forEach(b=>b.addEventListener('click',()=>playTrack(+b.dataset.index)));state.hidden=true}
function selectUI(i){current=i;const s=songs[i];document.querySelector('.song-title').textContent=s.title;document.querySelector('.song-artist').textContent=s.author||'YouTube';document.querySelector('.times span:last-child').textContent=fmt(duration(s.lengthSeconds));document.querySelector('.elapsed').textContent='00:00';seek.value=0;seek.max=duration(s.lengthSeconds)||1;render()}
function playerError(message){if(/PO.?Token|Companion is starting|valid potoken/i.test(message))return 'Invidious Companion এখন YouTube PO Token তৈরি করতে পারছে না। ৩০–৬০ সেকেন্ড অপেক্ষা করে আবার চেষ্টা করুন। সমস্যা থাকলে অন্য/নিজস্ব Invidious instance সেট করুন.\n'+message;return message}
function playbackFailure(message){state.hidden=false;state.classList.add('error');state.innerHTML=`${escapeHtml(message).replaceAll('\n','<br>')}<button id="retry-audio">অন্য instance দিয়ে আবার চেষ্টা</button>`;document.querySelector('#retry-audio').addEventListener('click',()=>playTrack(current,{fresh:true,excludeInstance:currentInstance}));msg(message.split('\n')[0])}
async function playTrack(i,options={}){if(!songs.length)return;current=(i+songs.length)%songs.length;const s=songs[current];selectUI(current);audio.pause();currentFormat=null;currentInstance='';audioFormatFallbackAttempted=false;audio.removeAttribute('src');audio.load();state.hidden=true;msg('Invidious থেকে audio stream আনা হচ্ছে…');try{const params=new URLSearchParams({videoId:s.videoId});if(options.fresh)params.set('fresh','1');if(options.excludeInstance)params.set('excludeInstance',options.excludeInstance);audio.src=`/api/audio?${params}`;audio.volume=volume.value/100;await audio.play();msg(`চলছে: ${s.title}`)}catch(e){if(e.name==='NotAllowedError'){playbackFailure('প্লে করতে আবার ▶ চাপুন।');return}playbackFailure(playerError(e.message||'Audio stream পাওয়া যায়নি।'));console.error(e)}}
async function loadPlaylist(){state.hidden=false;state.classList.remove('error');state.textContent='Invidious playlist load হচ্ছে…';try{const r=await fetch(`/api/playlist?playlistId=${encodeURIComponent(DEFAULT_PLAYLIST)}`);const data=await r.json();if(!r.ok)throw new Error(data.error||'Playlist load করা যায়নি');playlistTitle=data.title||'YouTube playlist';songs=data.videos||[];if(!songs.length)throw new Error('Playlist-এ কোনো public video পাওয়া যায়নি।');render();const first=songs[0];document.querySelector('.song-title').textContent=first.title;document.querySelector('.song-artist').textContent=first.author||'YouTube';document.querySelector('.times span:last-child').textContent=fmt(first.lengthSeconds);seek.max=duration(first.lengthSeconds)||1;state.textContent=`${songs.length} tracks loaded via ${data.instance}`;setTimeout(()=>state.hidden=true,2200)}catch(e){state.classList.add('error');state.innerHTML=`${escapeHtml(e.message).replaceAll('\n','<br>')}<button id="retry-playlist">আবার চেষ্টা করুন</button>`;document.querySelector('#retry-playlist').addEventListener('click',loadPlaylist);console.error(e)}}
document.querySelector('.toggle').addEventListener('click',async()=>{if(!songs.length){await loadPlaylist();return}if(current<0){await playTrack(0);return}if(audio.paused){try{await audio.play()}catch(e){msg(e.message)}}else audio.pause()});document.querySelector('.next').addEventListener('click',()=>songs.length&&playTrack(current+1));document.querySelector('.prev').addEventListener('click',()=>songs.length&&playTrack(current<=0?songs.length-1:current-1));
audio.addEventListener('play',()=>{document.querySelector('.toggle').textContent='Ⅱ';document.querySelector('.toggle').setAttribute('aria-label','বিরতি দিন')});audio.addEventListener('pause',()=>{document.querySelector('.toggle').textContent='▶';document.querySelector('.toggle').setAttribute('aria-label','চালান')});audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime;document.querySelector('.elapsed').textContent=fmt(audio.currentTime)});audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration||seek.max;document.querySelector('.times span:last-child').textContent=fmt(audio.duration)});audio.addEventListener('ended',()=>songs.length&&playTrack(current+1));audio.addEventListener('error',()=>{if(!audio.src)return;if(!audioFormatFallbackAttempted&&songs[current]){audioFormatFallbackAttempted=true;msg('WebM না চলায় MP4 audio format চেষ্টা করছি…');audio.src=`/api/audio?videoId=${encodeURIComponent(songs[current].videoId)}&format=mp4`;audio.load();audio.play().catch(()=>playbackFailure('MP4 ও WebM—দুই audio format-ই ব্যর্থ। Retry চাপুন।'));return}playbackFailure('Audio relay বা upstream stream ব্যর্থ হয়েছে। আবার চেষ্টা করলে server অন্য instance নেবে।');console.error('Audio stream error',audio.error)});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=+seek.value});volume.addEventListener('input',()=>{audio.volume=volume.value/100;msg('ভলিউম '+volume.value+'%')});document.querySelector('.theme').addEventListener('click',()=>{app.classList.toggle('dim');msg(app.classList.contains('dim')?'সন্ধ্যার আলো':'উষ্ণ আলো')});document.querySelectorAll('.fullscreen').forEach(b=>b.addEventListener('click',async()=>{try{document.fullscreenElement?await document.exitFullscreen():await app.requestFullscreen()}catch{}}));document.querySelector('.hide-list').addEventListener('click',()=>app.classList.add('list-hidden'));document.querySelector('.show-list').addEventListener('click',()=>app.classList.remove('list-hidden'));document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('.toggle').click()}if(e.code==='ArrowRight'&&songs.length)playTrack(current+1);if(e.code==='ArrowLeft'&&songs.length)playTrack(current<=0?songs.length-1:current-1)});loadPlaylist();
</script></body></html>
